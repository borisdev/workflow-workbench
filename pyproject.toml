[project]
name = "workflow-workbench"
version = "0.1.0"
description = "One fixed graph design, many competing implementations — checked, diagrammed, and battled on Pydantic Evals"
requires-python = ">=3.12"
dependencies = [
    "pydantic-graph>=2.0",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
evals = ["pydantic-evals>=2.0"]
# The browser dev tool. Optional: the library never imports it.
dev-server = ["fastapi>=0.110", "uvicorn>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pydantic-evals>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "playwright>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow_workbench"]
# The built island ships IN the wheel — `pip install` runs no node step.
artifacts = ["workflow_workbench/static/*"]
