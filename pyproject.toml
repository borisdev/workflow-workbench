[project]
name = "workflow-spec"
version = "0.1.0"
description = "One fixed graph design, many competing implementations — checked, diagrammed, and battled on Pydantic Evals"
requires-python = ">=3.12"
dependencies = [
    "pydantic-graph>=2.0",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
evals = ["pydantic-evals>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pydantic-evals>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow_spec"]
